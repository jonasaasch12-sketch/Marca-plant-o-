<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16807a">
<title>Marca Plantão</title>
<style>
:root{--primary:#16807a;--bg:#f4f6f6;--card:#ffffff;--text:#1c2425;--muted:#6a7677;--line:#e1e6e6;--ok:#1e8e3e;--no:#d93025}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1414;--card:#1a2223;--text:#eef3f3;--muted:#98a6a6;--line:#2b3637}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--primary);color:#fff;padding:14px 16px;font-size:18px;font-weight:600}
main{padding:12px 16px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 0 10px;font-size:12px;cursor:pointer}
nav button.on{color:var(--primary);font-weight:600}
nav i{display:block;font-style:normal;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.linha{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hora{font-size:15px;font-weight:600}
.valor{font-weight:600}
.nome{font-size:17px;font-weight:700;margin:4px 0}
.muted{color:var(--muted);font-size:14px}
.pill{border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:#fff;cursor:pointer}
.pill.ok{background:var(--ok)}
.pill.no{background:var(--no)}
.mesnav{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;text-transform:capitalize}
.mesnav button,.btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:16px;cursor:pointer}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
.btn.danger{color:var(--no)}
.semana,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.semana{font-size:12px;color:var(--muted);margin-bottom:4px}
.dia{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 0;min-height:52px;color:var(--text);cursor:pointer;font-size:14px}
.dia.hoje{border-color:var(--primary);font-weight:700}
.dia.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
.dots{display:flex;justify-content:center;gap:3px;margin-top:4px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
h3.sub{margin:16px 0 8px;font-size:15px;text-transform:capitalize}
.vazio{color:var(--muted);text-align:center;padding:20px 8px}
.totais{display:flex;gap:10px;margin-bottom:12px}
.totais div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.totais small{color:var(--muted);display:block}
.totais b{font-size:16px}
.filtros{display:flex;gap:6px;margin-bottom:12px}
.filtros button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;cursor:pointer}
.filtros button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.fab{position:fixed;right:18px;bottom:84px;width:56px;height:56px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;z-index:6;display:flex;align-items:center;justify-content:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);color:var(--text);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 8px;font-size:18px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:16px;font-family:inherit}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px;color:var(--text)}
.check input{width:auto}
.cores{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.cores button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.cores button.on{border-color:var(--text)}
.acoes{display:flex;gap:8px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.acoes .direita{display:flex;gap:8px;margin-left:auto}
.erro{color:var(--no);font-size:14px;min-height:20px;margin:8px 0 0}
.swipe{position:relative;margin-bottom:10px;border-radius:12px;overflow:hidden}
.swipe .card{margin:0;position:relative;z-index:1;touch-action:pan-y;background:var(--card);transition:transform .2s}
.acoes-swipe{position:absolute;right:0;top:0;bottom:0;display:flex;width:170px}
.acoes-swipe button{flex:1;border:0;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.sw-pago{background:var(--ok)}
.sw-del{background:var(--no)}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-150%);background:var(--ok);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;transition:transform .25s;max-width:90%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#toast.on{transform:translateX(-50%) translateY(0)}
.item-modelo{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;margin-top:6px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.grupo-local{font-weight:700;margin:14px 0 6px;padding-left:8px;border-left:4px solid var(--primary)}
</style>
</head>
<body>
<header id="top">Marca Plantão</header>
<main id="conteudo"><p class="vazio">Carregando…</p></main>
<button class="fab" id="fab" onclick="novoPlantao()" aria-label="Novo plantão" style="display:none">+</button>
<nav id="nav"></nav>

<!-- Firebase (SDK compatível, versão fixa) -->
<script src="https://cdn.jsdelivr.net/npm/firebase@11.6.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@11.6.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@11.6.1/firebase-firestore-compat.js"></script>

<script>
/* ============ CONFIGURAÇÃO DO FIREBASE ============ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAZtXzGXek3mKX2t3-QhAhmois1m1HeDUs",
  authDomain: "marca-plantao.firebaseapp.com",
  projectId: "marca-plantao",
  storageBucket: "marca-plantao.firebasestorage.app",
  messagingSenderId: "566340164573",
  appId: "1:566340164573:web:4993aed82b9cc26b5a7434"
};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const fs = firebase.firestore();
fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});

/* ============ ESTADO ============ */
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CORES=['#e53935','#d81b60','#8e24aa','#3949ab','#1e88e5','#00897b','#43a047','#fb8c00','#6d4c41','#546e7a'];

let db={locais:[],plantoes:[]};
let usuario=null;
let pronto=false;
let aba='cal';
let mes=new Date();
mes=new Date(mes.getFullYear(),mes.getMonth(),1);
let diaSel=iso(new Date());
let filtroPag='todos';

/* ============ FIRESTORE ============ */
function colecao(nome){return fs.collection('users').doc(usuario.uid).collection(nome);}

async function carregarDados(){
  const tempo=new Promise((_,rej)=>setTimeout(()=>rej(new Error('Tempo esgotado. Confirme no Firebase que o Firestore Database foi criado e que as regras foram publicadas.')),10000));
  const [l,p,m]=await Promise.race([Promise.all([colecao('locais').get(),colecao('plantoes').get(),colecao('modelos').get()]),tempo]);
  db.locais=l.docs.map(d=>({...d.data(),id:d.id}));
  db.plantoes=p.docs.map(d=>({...d.data(),id:d.id}));
  db.modelos=m.docs.map(d=>({...d.data(),id:d.id}));
}

// grava uma lista de {c:'plantoes'|'locais', obj}, em lotes de 400
async function gravar(itens){
  for(let i=0;i<itens.length;i+=400){
    const b=fs.batch();
    itens.slice(i,i+400).forEach(({c,obj})=>{
      const {id,...resto}=obj;
      b.set(colecao(c).doc(id),resto);
    });
    await b.commit();
  }
}
function gravarSeguro(itens){
  gravar(itens).catch(e=>alert('Não consegui salvar na nuvem. Verifique a conexão.\n'+e.message));
}
async function apagarColecao(nome){
  const s=await colecao(nome).get();
  for(let i=0;i<s.docs.length;i+=400){
    const b=fs.batch();
    s.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));
    await b.commit();
  }
}

/* ============ LOGIN ============ */
auth.onAuthStateChanged(async u=>{
  usuario=u;
  if(u){
    try{await carregarDados();}
    catch(e){
      db={locais:[],plantoes:[]};
      alert('Erro ao carregar seus dados: '+e.message);
    }
  }else{
    db={locais:[],plantoes:[]};
  }
  pronto=true;
  render();
});

function msgErro(e){
  const m={
    'auth/invalid-email':'E-mail inválido.',
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/user-not-found':'E-mail ou senha incorretos.',
    'auth/wrong-password':'E-mail ou senha incorretos.',
    'auth/email-already-in-use':'Este e-mail já tem conta. Tente entrar.',
    'auth/weak-password':'Use uma senha com pelo menos 6 caracteres.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde e tente de novo.',
    'auth/network-request-failed':'Sem conexão com a internet.',
    'auth/operation-not-allowed':'O login por e-mail e senha não está ativado no Firebase (Authentication → Sign-in method).',
    'auth/unauthorized-domain':'Este domínio não está autorizado no Firebase (Authentication → Configurações → Domínios autorizados).'
  };
  return m[e.code]||('Erro: '+(e.code||e.message||'desconhecido'));
}
function lerLogin(){return [document.getElementById('a_email').value.trim(),document.getElementById('a_senha').value];}
async function entrar(){
  const [e,s]=lerLogin();
  try{await auth.signInWithEmailAndPassword(e,s);}
  catch(err){document.getElementById('a_msg').textContent=msgErro(err);}
}
async function criarConta(){
  const [e,s]=lerLogin();
  try{await auth.createUserWithEmailAndPassword(e,s);}
  catch(err){document.getElementById('a_msg').textContent=msgErro(err);}
}
async function esqueciSenha(){
  const e=document.getElementById('a_email').value.trim();
  if(!e){alert('Digite seu e-mail primeiro.');return;}
  try{await auth.sendPasswordResetEmail(e);alert('Se o e-mail existir, enviamos um link para redefinir a senha.');}
  catch(err){alert(msgErro(err));}
}
async function sair(){await auth.signOut();}

/* ============ UTILIDADES ============ */
function p2(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function parseDT(s){
  const [d,t]=s.split('T');const [y,m,dd]=d.split('-').map(Number);const [h,mi]=t.split(':').map(Number);
  return new Date(y,m-1,dd,h,mi);
}
function dataBR(s){const [y,m,d]=s.split('T')[0].split('-');return `${d}/${m}/${y}`;}
function hora(s){return s.split('T')[1];}
function addDias(s,n){const d=parseDT(s);d.setDate(d.getDate()+n);return iso(d)+'T'+hora(s);}
function addDiasISO(s,n){
  if(!s)return '';
  const [y,m,d]=s.split('-').map(Number);
  return iso(new Date(y,m-1,d+n));
}
function dinheiro(v){return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function diaDe(p){return p.inicio.split('T')[0];}
function local(id){return db.locais.find(l=>l.id===id);}
function nomeLocal(id){const l=local(id);return l?l.nome:'Sem local';}
function corDe(p){return p.cor||'#16807a';}
function doMes(p){return diaDe(p).slice(0,7)===iso(mes).slice(0,7);}

/* ============ NAVEGAÇÃO ============ */
function ir(a){aba=a;render();window.scrollTo(0,0);}
function mudaMes(n){mes=new Date(mes.getFullYear(),mes.getMonth()+n,1);render();}
function selDia(d){diaSel=d;render();}
function setFiltro(f){filtroPag=f;render();}
function togglePago(id){
  const p=db.plantoes.find(x=>x.id===id);if(!p)return;
  p.pago=!p.pago;
  if(p.pago&&!p.dataPagamento)p.dataPagamento=iso(new Date());
  gravarSeguro([{c:'plantoes',obj:p}]);
  render();
}

/* ============ RENDERIZAÇÃO ============ */
function render(){
  const top=document.getElementById('top');
  const fab=document.getElementById('fab');
  const nav=document.getElementById('nav');
  const main=document.getElementById('conteudo');

  if(!pronto){main.innerHTML='<p class="vazio">Carregando…</p>';nav.innerHTML='';fab.style.display='none';return;}
  if(!usuario){
    top.textContent='Marca Plantão';
    nav.innerHTML='';fab.style.display='none';
    main.innerHTML=vLogin();
    return;
  }
  const abas=[['cal','📅','Calendário'],['pag','💰','Pagamentos'],['loc','🗂️','Cadastros'],['aj','⚙️','Ajustes']];
  nav.innerHTML=abas.map(([k,i,t])=>`<button class="${aba===k?'on':''}" onclick="ir('${k}')"><i>${i}</i>${t}</button>`).join('');
  const titulos={cal:'Marca Plantão',pag:'Pagamentos',loc:'Cadastros',aj:'Ajustes'};
  top.textContent=titulos[aba];
  fab.style.display=(aba==='cal'||aba==='pag')?'flex':'none';
  const views={cal:vCalendario,pag:vPagamentos,loc:vLocais,aj:vAjustes};
  main.innerHTML=views[aba]();
}

function vLogin(){
  return `<div class="card" style="cursor:default;margin-top:24px">
    <h2 style="margin:0 0 4px">Entrar</h2>
    <p class="muted" style="margin:0 0 4px">Seus plantões ficam salvos na sua conta e aparecem em qualquer aparelho.</p>
    <label>E-mail</label><input id="a_email" type="email" autocomplete="email">
    <label>Senha</label><input id="a_senha" type="password" autocomplete="current-password">
    <div class="acoes">
      <button class="btn" onclick="criarConta()">Criar conta</button>
      <div class="direita"><button class="btn primary" onclick="entrar()">Entrar</button></div>
    </div>
    <p style="margin:12px 0 0;text-align:center"><button class="btn" style="border:0;background:none;color:var(--primary)" onclick="esqueciSenha()">Esqueci minha senha</button></p>
    <p id="a_msg" class="erro"></p>
  </div>`;
}

function cardPlantao(p,comData){
  const cruza=diaDe(p)!==p.fim.split('T')[0];
  return `<div class="swipe">
    <div class="acoes-swipe">
      <button class="sw-pago" onclick="togglePago('${p.id}')">${p.pago?'Não pago':'Marcar pago'}</button>
      <button class="sw-del" onclick="excluirPlantao('${p.id}')">Excluir</button>
    </div>
    <div class="card swipe-card" data-id="${p.id}" style="border-left:6px solid ${corDe(p)}" onclick="cardClick('${p.id}')">
      ${comData?`<div class="muted" style="margin-bottom:4px">${dataBR(p.inicio)}</div>`:''}
      <div class="linha"><span class="hora">${hora(p.inicio)} – ${hora(p.fim)}${cruza?' <small class="muted">(+1 dia)</small>':''}</span><span class="valor">${dinheiro(p.valor)}</span></div>
      <div class="nome">${esc(p.nome||'Sem nome')}</div>
      <div class="linha"><span class="muted">📍 ${esc(nomeLocal(p.localId))}</span>
      <button class="pill ${p.pago?'ok':'no'}" onclick="event.stopPropagation();togglePago('${p.id}')">${p.pago?'Pago':'Não pago'}</button></div>
    </div>
  </div>`;
}

function vCalendario(){
  const ano=mes.getFullYear(),m=mes.getMonth();
  const vazios=new Date(ano,m,1).getDay();
  const dias=new Date(ano,m+1,0).getDate();
  const hoje=iso(new Date());
  let h=`<div class="mesnav"><button onclick="mudaMes(-1)">‹</button><strong>${MESES[m]} ${ano}</strong><button onclick="mudaMes(1)">›</button></div>`;
  h+=`<div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn${modoVarios?' primary':''}" style="flex:1" onclick="toggleModoVarios()">${modoVarios?'Selecionando vários dias ✔':'Selecionar vários dias'}</button>${modoVarios&&diasMulti.size?'<button class="btn" onclick="limparDias()">Limpar</button>':''}</div>`;
  h+='<div class="semana"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div><div class="grid">';
  for(let i=0;i<vazios;i++)h+='<div></div>';
  for(let d=1;d<=dias;d++){
    const k=`${ano}-${p2(m+1)}-${p2(d)}`;
    const pts=db.plantoes.filter(p=>diaDe(p)===k).slice(0,3).map(p=>`<i style="background:${corDe(p)}"></i>`).join('');
    const marcado=modoVarios?diasMulti.has(k):k===diaSel;
    h+=`<button class="dia${k===hoje?' hoje':''}${marcado?' sel':''}" onclick="clicouDia('${k}')">${d}<span class="dots">${pts}</span></button>`;
  }
  h+='</div>';
  h+='<button class="btn primary" style="width:100%;margin-top:10px" onclick="editarModelo()">+ Cadastrar novo plantão</button>';
  h+=`<div style="display:flex;gap:8px;margin-top:8px"><button class="btn" style="flex:1" onclick="novoPlantao()">+ Este dia</button><button class="btn primary" style="flex:1" onclick="abrirVarios()">+ Vários dias</button></div>`;
  const lista=db.plantoes.filter(p=>diaDe(p)===diaSel).sort((a,b)=>a.inicio.localeCompare(b.inicio));
  const [y,mm,dd]=diaSel.split('-').map(Number);
  const nomeDia=new Date(y,mm-1,dd).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  h+=`<h3 class="sub">${nomeDia}</h3>`;
  h+=lista.length?lista.map(p=>cardPlantao(p,false)).join(''):'<p class="vazio">Nenhum plantão neste dia.</p>';
  h+=blocoModelosDia();
  return h;
}

function vPagamentos(){
  const ano=mes.getFullYear(),m=mes.getMonth();
  const lista=db.plantoes.filter(doMes).sort((a,b)=>a.inicio.localeCompare(b.inicio));
  const pagos=lista.filter(p=>p.pago), naoPagos=lista.filter(p=>!p.pago);
  const soma=l=>l.reduce((s,p)=>s+Number(p.valor||0),0);
  const visiveis=filtroPag==='pagos'?pagos:filtroPag==='nao'?naoPagos:lista;
  let h=`<div class="mesnav"><button onclick="mudaMes(-1)">‹</button><strong>${MESES[m]} ${ano}</strong><button onclick="mudaMes(1)">›</button></div>`;
  h+=`<div class="totais">
    <div><small>Recebido</small><b style="color:var(--ok)">${dinheiro(soma(pagos))}</b></div>
    <div><small>A receber</small><b style="color:var(--no)">${dinheiro(soma(naoPagos))}</b></div>
  </div>`;
  h+=`<div class="filtros">${[['todos','Todos'],['nao','Não pagos'],['pagos','Pagos']]
    .map(([k,t])=>`<button class="${filtroPag===k?'on':''}" onclick="setFiltro('${k}')">${t}</button>`).join('')}</div>`;
  h+=visiveis.length?visiveis.map(p=>cardPlantao(p,true)).join(''):'<p class="vazio">Nada por aqui neste mês.</p>';
  return h;
}

function itemModelo(m){
  return `<div class="item-modelo" onclick="editarModelo('${m.id}')" style="border-left:4px solid ${m.cor}">
    <span><b>${esc(m.nome)}</b><br><small class="muted">${m.hini} – ${m.hfim}</small></span>
    <span class="valor">${dinheiro(m.valor)}</span></div>`;
}
function vLocais(){
  const modelos=db.modelos||[];
  let h='<button class="btn primary" style="width:100%;margin-bottom:8px" onclick="editarLocal()">+ Novo local</button>';
  h+='<button class="btn" style="width:100%;margin-bottom:12px" onclick="abrirResumo(\'todos\')">Resumo geral para nota</button>';
  if(!db.locais.length)h+='<p class="vazio">Cadastre um local (ex.: Hospital Tricentenário) e depois crie os plantões dentro dele.</p>';
  h+=db.locais.map(l=>{
    const ps=db.plantoes.filter(p=>p.localId===l.id);
    const tot=ps.reduce((s,p)=>s+Number(p.valor||0),0);
    const ms=modelos.filter(m=>m.localId===l.id);
    return `<div class="card" style="border-left:6px solid ${l.cor};cursor:default">

function salvarPlantao(id){
  const g=x=>document.getElementById(x);
  const ini=g('f_ini').value, fim=g('f_fim').value;
  if(!ini||!fim){alert('Preencha início e fim.');return;}
  if(parseDT(fim)<=parseDT(ini)){alert('O fim precisa ser depois do início.');return;}
  const dados={
    nome:g('f_nome').value.trim(),
    localId:g('f_local').value||null,
    cor:g('f_cor').value,
    valor:parseFloat(String(g('f_valor').value).replace(',','.'))||0,
    inicio:ini,fim:fim,
    pago:g('f_pago').checked,
    dataPagamento:g('f_dpag').value,
    obs:g('f_obs').value.trim()
  };
  let itens=[];
  if(id){
    const p=db.plantoes.find(x=>x.id===id);
    Object.assign(p,dados);
    itens=[{c:'plantoes',obj:p}];
  }else{
    if(g('f_salvarmod').checked&&!dados.nome){alert('Dê um nome ao plantão para salvá-lo como cadastrado.');return;}
    const n=Math.max(0,parseInt(g('f_rep').value)||0);
    for(let k=0;k<=n;k++){
      const obj={id:uid(),...dados,
        inicio:addDias(ini,7*k),
        fim:addDias(fim,7*k),
        dataPagamento:addDiasISO(dados.dataPagamento,7*k)};
      db.plantoes.push(obj);
      itens.push({c:'plantoes',obj});
    }
    if(g('f_salvarmod').checked){
      const mod={id:uid(),nome:dados.nome,localId:dados.localId,cor:dados.cor,valor:dados.valor,
        hini:ini.split('T')[1].slice(0,5),hfim:fim.split('T')[1].slice(0,5)};
      db.modelos=db.modelos||[];db.modelos.push(mod);
      itens.push({c:'modelos',obj:mod});
    }
  }
  gravarSeguro(itens);
  fechar();render();
  if(!id)mostrarAviso(itens.some(i=>i.c==='modelos')?'Plantão criado e cadastrado com sucesso.':'Plantão criado com sucesso.');
}

/* ============ BACKUP ============ */
function exportar(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='backup-marca-plantao-'+iso(new Date())+'.json';
  a.click();
}
function importar(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    let d;
    try{d=JSON.parse(r.result);}catch(e){d=null;}
    if(!d||!Array.isArray(d.plantoes)||!Array.isArray(d.locais)){alert('Arquivo inválido.');return;}
    if(!confirm('Substituir TODOS os seus dados atuais pelo backup?'))return;
    try{
      await apagarColecao('plantoes');
      await apagarColecao('locais');
      await apagarColecao('modelos');
      await gravar([
        ...d.locais.map(obj=>({c:'locais',obj})),
        ...d.plantoes.map(obj=>({c:'plantoes',obj})),
        ...(d.modelos||[]).map(obj=>({c:'modelos',obj}))
      ]);
      await carregarDados();
      render();
      alert('Backup restaurado.');
    }catch(e){alert('Erro ao restaurar: '+e.message);}
  };
  r.readAsText(f);
}
async function apagarTudo(){
  if(!confirm('Apagar TODOS os seus plantões e locais? Isso não pode ser desfeito.'))return;
  try{
    await apagarColecao('plantoes');
    await apagarColecao('locais');
    await apagarColecao('modelos');
    db={locais:[],plantoes:[],modelos:[]};
    render();
  }catch(e){alert('Erro ao apagar: '+e.message);}
}

/* ============ SWIPE NOS PLANTÕES ============ */
const ABRE=170;
let sw=null, swipeMoveu=false;
const conteudoEl=document.getElementById('conteudo');
conteudoEl.addEventListener('pointerdown',e=>{
  const card=e.target.closest('.swipe-card');
  if(!card)return;
  sw={card,x:e.clientX,y:e.clientY,dx:0,base:card.dataset.open==='1'?-ABRE:0,moved:false};
});
conteudoEl.addEventListener('pointermove',e=>{
  if(!sw)return;
  const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
  if(!sw.moved){
    if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>8){sw=null;return;}
    if(Math.abs(dx)<8)return;
    sw.moved=true;
    sw.card.style.transition='none';
  }
  sw.dx=dx;
  const pos=Math.max(-ABRE,Math.min(0,sw.base+dx));
  sw.card.style.transform=`translateX(${pos}px)`;
});
function fimSwipe(){
  if(!sw)return;
  const {card,base,dx,moved}=sw;
  sw=null;
  if(!moved)return;
  swipeMoveu=true;
  setTimeout(()=>swipeMoveu=false,300);
  const abrir=(base+dx)<-ABRE/2;
  card.style.transition='transform .2s';
  card.dataset.open=abrir?'1':'0';
  card.style.transform=abrir?`translateX(-${ABRE}px)`:'translateX(0)';
}
conteudoEl.addEventListener('pointerup',fimSwipe);
conteudoEl.addEventListener('pointercancel',fimSwipe);
function fecharSwipe(card){
  card.style.transition='transform .2s';
  card.dataset.open='0';
  card.style.transform='translateX(0)';
}
function cardClick(id){
  if(swipeMoveu)return;
  const c=document.querySelector(`.swipe-card[data-id="${id}"]`);
  if(c&&c.dataset.open==='1'){fecharSwipe(c);return;}
  editarPlantao(id);
}

function renderGridVarios(){

function toggleDiaVarios(k){
  if(multiDias.has(k))multiDias.delete(k);else multiDias.add(k);
  renderGridVarios();

  dias.forEach(k=>{

/* ============ RESUMO PARA NOTA FISCAL ============ */
const CATS={diurno:'Plantões diurnos',noturno:'Plantões noturnos',fds:'Plantões de final de semana'};
const ORDEM_CAT=['diurno','noturno','fds'];

function classificarPlantao(p){
  const d=parseDT(p.inicio);
  const dia=d.getDay();
  if(dia===0||dia===6)return 'fds';
  const h=d.getHours();
  return (h>=7&&h<19)?'diurno':'noturno';
}
function filtrarResumo(localId,periodo,status,de,ate){
  return db.plantoes.filter(p=>
    (localId==='todos'||p.localId===localId) &&
    (periodo==='todos'||
      (periodo==='mes'&&diaDe(p).slice(0,7)===iso(mes).slice(0,7))||
      (periodo==='intervalo'&&(!de||diaDe(p)>=de)&&(!ate||diaDe(p)<=ate))) &&
    (status==='todos'||(status==='pagos'?p.pago:!p.pago))
  ).sort((a,b)=>a.inicio.localeCompare(b.inicio));
}
function gerarTextoNota(lista,de,ate){
  if(!lista.length)return 'Nenhum plantão encontrado com esses filtros.';
  const grupos={};
  lista.forEach(p=>{
    const loc=nomeLocal(p.localId);
    const cat=classificarPlantao(p);
    const chave=loc+'|'+cat;
    if(!grupos[chave])grupos[chave]={loc,cat,itens:[]};
    grupos[chave].itens.push(p);
  });
  const linhas=Object.values(grupos).sort((a,b)=>a.loc.localeCompare(b.loc)||ORDEM_CAT.indexOf(a.cat)-ORDEM_CAT.indexOf(b.cat));
  const partes=linhas.map(g=>{
    const datas=[...new Set(g.itens.map(p=>dataBR(p.inicio).slice(0,5)))];
    const v=g.itens.reduce((s,p)=>s+Number(p.valor||0),0);
    const n=g.itens.length;
    return `${CATS[g.cat]}, ${g.loc}, dias ${datas.join(', ')}, ${n} ${n===1?'plantão':'plantões'}, valor total ${dinheiro(v)}.`;
  });
  const total=lista.reduce((s,p)=>s+Number(p.valor||0),0);
  const ini=de?dataBR(de+'T00:00'):dataBR(lista[0].inicio), fim=ate?dataBR(ate+'T00:00'):dataBR(lista[lista.length-1].inicio);
  return `Período: ${ini} a ${fim}\n\n${partes.join('\n')}\n\nValor total: ${dinheiro(total)}`;
}
function abrirResumo(localId){
  const opts=['<option value="todos">Todos os locais</option>',
    ...db.locais.map(l=>`<option value="${l.id}" ${l.id===localId?'selected':''}>${esc(l.nome)}</option>`)].join('');
  abrirForm(`
    <h2>Resumo para nota fiscal</h2>
    <label>Local</label><select id="r_local" onchange="atualizaResumo()">${opts}</select>
    <label>Período</label>
    <select id="r_periodo" onchange="atualizaResumo()">
      <option value="intervalo">Escolher datas (de / até)</option>
      <option value="mes">Só o mês exibido no calendário</option>
      <option value="todos">Todo o período</option>
    </select>
    <div id="r_datas" style="display:flex;gap:8px">
      <div style="flex:1"><label>De</label><input id="r_de" type="date" value="${iso(new Date(mes.getFullYear(),mes.getMonth(),1))}" onchange="atualizaResumo()"></div>
      <div style="flex:1"><label>Até</label><input id="r_ate" type="date" value="${iso(new Date(mes.getFullYear(),mes.getMonth()+1,0))}" onchange="atualizaResumo()"></div>
    </div>
    <label>Situação</label>
    <select id="r_status" onchange="atualizaResumo()">
      <option value="todos">Todos</option>
      <option value="pagos">Só pagos</option>
      <option value="nao">Só não pagos</option>
    </select>
    <div id="r_resumo"></div>
    <label>Texto para colar na nota</label>
    <textarea id="r_texto" rows="10" readonly></textarea>
    <div class="acoes">
      <button class="btn" onclick="fechar()">Fechar</button>
      <button class="btn primary" onclick="copiarNota()">Copiar texto</button>
    </div>`);
  atualizaResumo();
}
function atualizaResumo(){
  const loc=document.getElementById('r_local').value;
  const per=document.getElementById('r_periodo').value;
  document.getElementById('r_datas').style.display=per==='intervalo'?'flex':'none';
  let de='',ate='';
  if(per==='intervalo'){
    de=document.getElementById('r_de').value;ate=document.getElementById('r_ate').value;
    if(de&&ate&&de>ate){[de,ate]=[ate,de];}
  }
  const lista=filtrarResumo(loc,per,document.getElementById('r_status').value,de,ate);
  const total=lista.reduce((s,p)=>s+Number(p.valor||0),0);
  document.getElementById('r_resumo').innerHTML=
    `<div class="totais" style="margin-top:12px"><div><small>Plantões</small><b>${lista.length}</b></div><div><small>Valor total</small><b>${dinheiro(total)}</b></div></div>`;
  document.getElementById('r_texto').value=gerarTextoNota(lista,de,ate);
}
function copiarNota(){
  const t=document.getElementById('r_texto');
  t.removeAttribute('readonly');
  t.select();
  t.setSelectionRange(0,999999);
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  t.setAttribute('readonly','');
  alert(ok?'Texto copiado. Agora é só colar na nota.':'Não consegui copiar automaticamente. Toque no texto, selecione tudo e copie.');
}

/* ============ MODELOS DE PLANTÃO ============ */
function opcoesModelos(){
  return (db.modelos||[]).map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('');
}
function aplicarModelo(){
  const m=(db.modelos||[]).find(x=>x.id===document.getElementById('f_modelo').value);
  if(!m)return;
  const dia=document.getElementById('f_ini').value.split('T')[0]||diaSel;
  const ini=dia+'T'+m.hini;
  let fim=dia+'T'+m.hfim;
  if(parseDT(fim)<=parseDT(ini))fim=addDias(fim,1);
  document.getElementById('f_nome').value=m.nome;
  document.getElementById('f_local').value=m.localId||'';
  escolherCor(m.cor);
  document.getElementById('f_valor').value=m.valor||'';
  document.getElementById('f_ini').value=ini;
  document.getElementById('f_fim').value=fim;
}
function aplicarModeloVarios(){
  const m=(db.modelos||[]).find(x=>x.id===document.getElementById('v_modelo').value);
  if(!m){document.getElementById('v_nome').value='';document.getElementById('v_valor').value='';return;}
  document.getElementById('v_nome').value=m.nome;
  escolherCor(m.cor);
  document.getElementById('v_valor').value=m.valor||'';
  document.getElementById('v_ini').value=m.hini;
  document.getElementById('v_fim').value=m.hfim;
}
function usarModeloNoDia(id){
  const m=(db.modelos||[]).find(x=>x.id===id);
  if(!m)return;
  const base={id:'',nome:m.nome,localId:m.localId||null,cor:m.cor,valor:m.valor||'',
    inicio:diaSel+'T'+m.hini,fim:diaSel+'T'+m.hfim,pago:false,dataPagamento:'',obs:''};
  if(parseDT(base.fim)<=parseDT(base.inicio))base.fim=addDias(base.fim,1);
  aba='cal';
  formPlantao(base,true);
}
function editarModelo(id,localPreset){
  const lp=localPreset?local(localPreset):null;
  const m=id?(db.modelos||[]).find(x=>x.id===id):{id:'',nome:'',localId:localPreset||'',cor:lp?lp.cor:CORES[4],valor:'',hini:'07:00',hfim:'19:00'};
  abrirForm(`
    <h2>${id?'Editar plantão cadastrado':'Cadastrar novo plantão'}</h2>
    <p class="muted" style="margin:0 0 6px">Fica salvo para você usar sempre que quiser. Ex.: Hospital Tricentenário → Emergência pediátrica.</p>
    <label>Local</label><select id="m_local" onchange="localEscolhido(this)">${opcoesLocal(m.localId)}</select>
    <label>Nome do plantão</label><input id="m_nome" value="${esc(m.nome)}" placeholder="Ex.: Emergência pediátrica">
    <label>Cor</label><div class="cores" id="f_cores">${swatches(m.cor)}</div><input type="hidden" id="f_cor" value="${m.cor}">
    <label>Valor (R$)</label><input id="m_valor" inputmode="decimal" value="${m.valor||''}">
    <label>Horário de início</label><input id="m_ini" type="time" value="${m.hini}">
    <label>Horário de fim</label><input id="m_fim" type="time" value="${m.hfim}">
    <div class="acoes">
      ${id?`<button class="btn danger" onclick="excluirModelo('${id}')">Excluir</button>`:''}
      <div class="direita">
        <button class="btn" onclick="fechar()">Cancelar</button>
        <button class="btn primary" onclick="salvarModelo('${id||''}')">Salvar</button>
      </div>
    </div>`);
}
function salvarModelo(id){
  const g=x=>document.getElementById(x).value;
  const nome=g('m_nome').trim();
  if(!nome){alert('Dê um nome ao plantão.');return;}
  const dados={
    nome,
    localId:g('m_local')||null,
    cor:g('f_cor'),
    valor:parseFloat(String(g('m_valor')).replace(',','.'))||0,
    hini:g('m_ini')||'07:00',
    hfim:g('m_fim')||'19:00'
  };
  let obj;
  if(id){obj=db.modelos.find(x=>x.id===id);Object.assign(obj,dados);}
  else{obj={id:uid(),...dados};db.modelos=db.modelos||[];db.modelos.push(obj);}
  gravarSeguro([{c:'modelos',obj}]);
  fechar();render();
  mostrarAviso(id?'Plantão cadastrado atualizado.':'Plantão cadastrado com sucesso.');
}
let modoVarios=false;
let diasMulti=new Set();
function alvosDias(){
  return modoVarios&&diasMulti.size?[...diasMulti].sort():[diaSel];
}
function clicouDia(k){
  if(modoVarios){
    if(diasMulti.has(k))diasMulti.delete(k);else diasMulti.add(k);
    diaSel=k;
    render();
  }else selDia(k);
}
function toggleModoVarios(){
  modoVarios=!modoVarios;
  diasMulti=new Set(modoVarios?[diaSel]:[]);
  render();
}
function limparDias(){
  diasMulti=new Set();
  render();
}
function blocoModelosDia(){
  const modelos=db.modelos||[];
  const alvos=alvosDias();
  let h=`<h3 class="sub">Plantões para ${alvos.length>1?alvos.length+' dias selecionados':dataBR(alvos[0]+'T00:00')}</h3>`;
  if(!modelos.length)return h+'<p class="vazio">Você ainda não cadastrou plantões. Toque em "+ Cadastrar novo plantão", logo abaixo do calendário (ex.: Hospital Tricentenário → Pediatria).</p>';
  const grupos=[...db.locais.map(l=>({id:l.id,nome:l.nome,cor:l.cor})),{id:null,nome:'Sem local',cor:'#6a7677'}];
  grupos.forEach(g=>{
    const ms=modelos.filter(m=>(m.localId||null)===g.id);
    if(!ms.length)return;
    h+=`<div class="grupo-local" style="border-left-color:${g.cor}">${esc(g.nome)}</div>`;
    h+=ms.map(m=>`<div class="card" style="border-left:6px solid ${m.cor};cursor:default">
      <div class="linha"><span class="nome" style="margin:0;cursor:pointer" onclick="editarModelo('${m.id}')">${esc(m.nome)} <small class="muted">✏️</small></span><span class="valor">${dinheiro(m.valor)}</span></div>
      <div class="linha" style="margin-top:6px"><span class="muted">${m.hini} – ${m.hfim}</span>
      <button class="pill no" onclick="criarModeloNoDia('${m.id}')">Criar como Não Pago</button></div>
    </div>`).join('');
  });
  return h;
}
function criarModeloNoDia(id){
  const m=(db.modelos||[]).find(x=>x.id===id);
  if(!m)return;
  const itens=alvosDias().map(dia=>{
    const ini=dia+'T'+m.hini;
    let fim=dia+'T'+m.hfim;
    if(parseDT(fim)<=parseDT(ini))fim=addDias(fim,1);
    return {id:uid(),nome:m.nome,localId:m.localId||null,cor:m.cor,valor:m.valor||0,
      inicio:ini,fim,pago:false,dataPagamento:'',obs:''};
  });
  itens.forEach(o=>db.plantoes.push(o));
  gravarSeguro(itens.map(obj=>({c:'plantoes',obj})));
  diaSel=itens[0].inicio.split('T')[0];
  modoVarios=false;
  diasMulti=new Set();
  aba='cal';
  render();
  mostrarAviso(itens.length>1?`${itens.length} plantões criados com sucesso.`:'Plantão criado com sucesso.');
}
function mostrarAviso(texto){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=texto;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h=setTimeout(()=>t.classList.remove('on'),2200);
}
function excluirModelo(id){
  if(!confirm('Excluir este modelo? Os plantões já criados não são apagados.'))return;
  db.modelos=(db.modelos||[]).filter(m=>m.id!==id);
  fs.collection('users').doc(usuario.uid).collection('modelos').doc(id).delete()
    .catch(e=>alert('Não consegui excluir na nuvem: '+e.message));
  fechar();render();
}

render();
</script>
