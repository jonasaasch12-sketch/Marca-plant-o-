<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Agenda de plantões, pagamentos e texto para nota fiscal.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marca Plantão">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="marca/icone.svg">
<link rel="icon" type="image/png" sizes="32x32" href="marca/favicon-32.png">
<link rel="apple-touch-icon" href="marca/apple-touch-icon.png">
<title>Marca Plantão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ IDENTIDADE ============ */
:root{
  --primary:#0f766e;--primary-2:#14b8a6;--primary-soft:#e3f5f2;--on-primary:#fff;--accent:#f59e0b;
  --bg:#f3f6f6;--card:#ffffff;--card-2:#f8fafa;--text:#10201f;--muted:#667a7b;--line:#e2e9e9;
  --ok:#15803d;--ok-soft:#dcfce7;--no:#e11d48;--no-soft:#ffe4e6;
  --shadow:0 1px 2px rgba(16,32,31,.05),0 6px 18px rgba(16,32,31,.06);
  --radius:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary:#0f8f85;--primary-2:#2dd4bf;--primary-soft:#123a37;
  --bg:#0a1112;--card:#121d1e;--card-2:#172526;--text:#e6f0ef;--muted:#91a5a5;--line:#213233;
  --ok:#4ade80;--ok-soft:#0f3320;--no:#fb7185;--no-soft:#3b1520;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
html .btn.soft,html .btn.link{color:var(--primary-2)}
html nav button.on,html .dia.hoje{color:var(--primary-2)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font-family:inherit}
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}

/* ============ TOPO ============ */
header{position:sticky;top:0;z-index:5;color:#fff;background:linear-gradient(135deg,var(--primary-2) -40%,var(--primary) 55%,#0b4f4a 140%);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;box-shadow:0 2px 12px rgba(15,118,110,.25)}
.topo{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.topo .marca{width:34px;height:34px;flex:none;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.topo h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.topo h1 span{font-weight:500;opacity:.9}
.topo small{display:block;font-size:12px;font-weight:500;opacity:.85;margin-top:1px}
main{padding:14px 16px;max-width:720px;margin:0 auto}

/* ============ NAVEGAÇÃO ============ */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .itens{display:flex;width:100%;max-width:720px}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:4px 0;font-size:11.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .bolha{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px;transition:background .2s}
nav button.on{color:var(--primary)}
nav button.on .bolha{background:var(--primary-soft)}
nav svg.ic{width:22px;height:22px}

/* ============ BLOCOS ============ */
.painel,.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.painel{padding:14px;margin-bottom:12px}
.card{padding:14px 16px;margin-bottom:10px;cursor:pointer;border:1px solid transparent}
.linha{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hora{font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.valor{font-weight:700;font-variant-numeric:tabular-nums}
.nome{font-size:17px;font-weight:700;margin:4px 0;letter-spacing:-.01em}
.muted{color:var(--muted);font-size:14px}
.local{display:inline-flex;align-items:center;gap:5px}
.local svg.ic{width:15px;height:15px}
.pill{border:0;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--no-soft);color:var(--no)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
h3.sub{margin:20px 2px 10px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.vazio{color:var(--muted);text-align:center;padding:22px 8px;font-size:14px}
.titulo-sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}

/* ============ BOTÕES ============ */
.btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;transition:transform .08s,filter .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary);box-shadow:0 4px 12px rgba(15,118,110,.25)}
.btn.soft{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.btn.danger{color:var(--no)}
.btn.link{border:0;background:none;color:var(--primary);box-shadow:none}
.acoes-cal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
.acoes-cal .btn.primary{grid-column:1/-1;min-height:50px;font-size:16px}

/* ============ CALENDÁRIO ============ */
.mesnav{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;text-transform:capitalize}
.mesnav strong{font-size:18px;font-weight:700;letter-spacing:-.01em}
.mesnav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.chip{border:1px solid var(--line);background:var(--card-2);color:var(--text);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.semana,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.semana{font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.dia{background:transparent;border:0;border-radius:12px;padding:7px 0 5px;min-height:48px;color:var(--text);cursor:pointer;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center}
.dia:hover{background:var(--card-2)}
.dia.hoje{color:var(--primary);font-weight:800;box-shadow:inset 0 0 0 2px var(--primary)}
.dia.sel{background:var(--primary);color:#fff;font-weight:700;box-shadow:0 4px 10px rgba(15,118,110,.3)}
.dots{display:flex;justify-content:center;gap:3px;margin-top:4px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.dia.sel .dots i{box-shadow:0 0 0 1.5px #fff}

/* ============ RESUMO DO MÊS ============ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.stats small{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.stats b{display:block;font-size:15px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.totais{display:flex;gap:10px;margin-bottom:12px}
.totais div{flex:1;background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.totais small{color:var(--muted);display:block;font-size:12px;font-weight:600}
.totais b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.filtros{display:flex;gap:4px;margin-bottom:12px;background:var(--card-2);padding:4px;border-radius:12px;border:1px solid var(--line)}
.filtros button{flex:1;padding:8px;border-radius:9px;border:0;background:none;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
.filtros button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* ============ BOTÃO FLUTUANTE ============ */
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff;box-shadow:0 8px 20px rgba(15,118,110,.4);cursor:pointer;z-index:6;display:flex;align-items:center;justify-content:center}
.fab svg.ic{width:28px;height:28px;stroke-width:2.4}

/* ============ JANELAS (FORMULÁRIOS) ============ */
.overlay{position:fixed;inset:0;background:rgba(6,20,19,.5);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .15s}
.sheet{background:var(--bg);color:var(--text);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:sobe .22s ease-out}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 8px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.sheet h3.sub{text-transform:none}
@keyframes sobe{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:16px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;font-weight:500;color:var(--text)}
.check input{width:20px;height:20px;accent-color:var(--primary)}
.cor-nome{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:0 0 10px}
.cor-nome i{width:16px;height:16px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.grade-cores{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:10px}
.cor{position:relative;aspect-ratio:1;width:100%;border:0;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 2px 6px rgba(16,32,31,.12);transition:transform .1s;padding:0;margin:0;font:inherit;color:#fff}
.cor:active{transform:scale(.94)}
.cor svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.cor.clara{color:#10201f}
.cor.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--text)}
.cor.on svg{opacity:1}
.cor.outra{background:conic-gradient(#e11d2e,#facc15,#15803d,#38bdf8,#7c3aed,#ff00ff,#e11d2e)}
.cor.outra span{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.cor.outra.on span{display:none}
.cor.outra input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0;border:0}
html .dots i{box-shadow:0 0 0 1px rgba(127,127,127,.35)}
.acoes{display:flex;gap:8px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.acoes .direita{display:flex;gap:8px;margin-left:auto}
.erro:empty{display:none}
.erro{color:var(--no);font-size:14px;min-height:20px;margin:8px 0 0;text-align:center}

/* ============ CARTÕES DE PLANTÃO ============ */
.swipe{position:relative;margin-bottom:10px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.swipe .card{border-radius:0;margin:0;position:relative;z-index:1;touch-action:pan-y;transition:transform .2s;box-shadow:none;border-left:5px solid var(--primary)}
.acoes-swipe{position:absolute;right:1px;top:1px;bottom:1px;display:flex;width:170px;visibility:hidden}
.swipe.ativo .acoes-swipe{visibility:visible}
.acoes-swipe button{flex:1;border:0;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.sw-pago{background:var(--ok)}
.sw-del{background:var(--no)}
.item-modelo{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;margin-top:8px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card-2)}
.grupo-local{font-weight:700;margin:14px 0 6px;padding-left:8px;border-left:4px solid var(--primary)}

/* ============ AVISO ============ */
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-160%);background:#10201f;color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:20;transition:transform .25s;max-width:90%;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px}
#toast::before{content:"✓";display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#10201f;font-size:13px;font-weight:800}
#toast.on{transform:translateX(-50%) translateY(0)}

/* ============ ENTRADA ============ */
body.sem-topo header{display:none}
.entrada{max-width:420px;margin:0 auto;padding-top:calc(28px + env(safe-area-inset-top))}
.hero{text-align:center;margin:8px 0 18px}
.hero img{width:84px;height:84px;border-radius:24px;box-shadow:0 10px 24px rgba(15,118,110,.3)}
.hero h1{margin:14px 0 4px;font-size:28px;font-weight:800;letter-spacing:-.02em}
.hero h1 span{color:var(--primary);}
.hero p{margin:0 auto;max-width:300px;color:var(--muted);font-size:15px;line-height:1.45}
.entrada .btn{width:100%}
.rodape{text-align:center;color:var(--muted);font-size:12.5px;margin:22px 0 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.rodape img{width:28px;height:28px;border-radius:8px;opacity:.9}
</style>
</head>
<body>
<header><div class="topo"><img class="marca" src="marca/icone.svg" alt=""><div><h1 id="top"><span>Marca</span> Plantão</h1><small id="subtopo"></small></div></div></header>
<main id="conteudo"><p class="vazio">Carregando…</p></main>
<button class="fab" id="fab" onclick="novoPlantao()" aria-label="Novo plantão" style="display:none"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="nav"></nav>

<!-- Firebase (SDK compatível, versão fixa) -->
<script src="https://cdn.jsdelivr.net/npm/firebase@11.6.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@11.6.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@11.6.1/firebase-firestore-compat.js"></script>

<script>
/* ============ CONFIGURAÇÃO DO FIREBASE ============ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAZtXzGXek3mKX2t3-QhAhmois1m1HeDUs",
  authDomain: "marca-plantao.firebaseapp.com",
  projectId: "marca-plantao",
  storageBucket: "marca-plantao.firebasestorage.app",
  messagingSenderId: "566340164573",
  appId: "1:566340164573:web:4993aed82b9cc26b5a7434"
};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const fs = firebase.firestore();
fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});

/* ============ ESTADO ============ */
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
// Paleta escolhida por diferença de cor (ΔE2000 ≥ 20 entre qualquer par): nenhuma fica parecida com outra.
const PALETA=[['Vermelho','#e11d2e'],['Laranja','#f97316'],['Amarelo','#facc15'],['Lima','#84cc16'],['Verde','#15803d'],
  ['Turquesa','#14b8a6'],['Azul-claro','#38bdf8'],['Azul','#007aff'],['Azul-marinho','#172554'],['Roxo','#7c3aed'],
  ['Magenta','#ff00ff'],['Rosa','#f9a8d4'],['Marrom','#8e5a2e'],['Vinho','#800000'],['Cinza','#9ca3af']];
const CORES=PALETA.map(c=>c[1]);
const COR_PADRAO='#007aff';
// Cores da paleta antiga -> equivalente na nova (só na tela; grava ao editar)
const COR_ANTIGA={'#e53935':'#e11d2e','#d81b60':'#f9a8d4','#8e24aa':'#7c3aed','#3949ab':'#172554','#1e88e5':'#007aff',
  '#00897b':'#14b8a6','#43a047':'#15803d','#fb8c00':'#f97316','#6d4c41':'#8e5a2e','#546e7a':'#9ca3af','#16807a':'#14b8a6'};
function nomeCor(c){const p=PALETA.find(x=>x[1]===String(c).toLowerCase());return p?p[0]:'Personalizada';}
function corClara(c){const h=String(c).replace('#','');if(h.length<6)return false;const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16));return (0.299*r+0.587*g+0.114*b)>170;}

let db={locais:[],plantoes:[]};
let usuario=null;
let pronto=false;
let aba='cal';
let mes=new Date();
mes=new Date(mes.getFullYear(),mes.getMonth(),1);
let diaSel=iso(new Date());
let filtroPag='todos';

/* ============ FIRESTORE ============ */
function colecao(nome){return fs.collection('users').doc(usuario.uid).collection(nome);}

async function carregarDados(){
  const tempo=new Promise((_,rej)=>setTimeout(()=>rej(new Error('Tempo esgotado. Confirme no Firebase que o Firestore Database foi criado e que as regras foram publicadas.')),10000));
  const [l,p,m]=await Promise.race([Promise.all([colecao('locais').get(),colecao('plantoes').get(),colecao('modelos').get()]),tempo]);
  db.locais=l.docs.map(d=>({...d.data(),id:d.id}));
  db.plantoes=p.docs.map(d=>({...d.data(),id:d.id}));
  db.modelos=m.docs.map(d=>({...d.data(),id:d.id}));
  [...db.locais,...db.plantoes,...db.modelos].forEach(o=>{const n=COR_ANTIGA[String(o.cor||'').toLowerCase()];if(n)o.cor=n;});
}

// grava uma lista de {c:'plantoes'|'locais', obj}, em lotes de 400
async function gravar(itens){
  for(let i=0;i<itens.length;i+=400){
    const b=fs.batch();
    itens.slice(i,i+400).forEach(({c,obj})=>{
      const {id,...resto}=obj;
      b.set(colecao(c).doc(id),resto);
    });
    await b.commit();
  }
}
function gravarSeguro(itens){
  gravar(itens).catch(e=>alert('Não consegui salvar na nuvem. Verifique a conexão.\n'+e.message));
}
async function apagarColecao(nome){
  const s=await colecao(nome).get();
  for(let i=0;i<s.docs.length;i+=400){
    const b=fs.batch();
    s.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));
    await b.commit();
  }
}

/* ============ LOGIN ============ */
auth.onAuthStateChanged(async u=>{
  usuario=u;
  if(u){
    try{await carregarDados();}
    catch(e){
      db={locais:[],plantoes:[],modelos:[]};
      alert('Erro ao carregar seus dados: '+e.message);
    }
  }else{
    db={locais:[],plantoes:[]};
  }
  pronto=true;
  render();
});

function msgErro(e){
  const m={
    'auth/invalid-email':'E-mail inválido.',
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/user-not-found':'E-mail ou senha incorretos.',
    'auth/wrong-password':'E-mail ou senha incorretos.',
    'auth/email-already-in-use':'Este e-mail já tem conta. Tente entrar.',
    'auth/weak-password':'Use uma senha com pelo menos 6 caracteres.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde e tente de novo.',
    'auth/network-request-failed':'Sem conexão com a internet.',
    'auth/operation-not-allowed':'O login por e-mail e senha não está ativado no Firebase (Authentication → Sign-in method).',
    'auth/unauthorized-domain':'Este domínio não está autorizado no Firebase (Authentication → Configurações → Domínios autorizados).'
  };
  return m[e.code]||('Erro: '+(e.code||e.message||'desconhecido'));
}

/* ============ UTILIDADES ============ */
function p2(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function parseDT(s){
  const [d,t]=s.split('T');const [y,m,dd]=d.split('-').map(Number);const [h,mi]=t.split(':').map(Number);
  return new Date(y,m-1,dd,h,mi);
}
function dataBR(s){const [y,m,d]=s.split('T')[0].split('-');return `${d}/${m}/${y}`;}
function hora(s){return s.split('T')[1];}
function addDias(s,n){const d=parseDT(s);d.setDate(d.getDate()+n);return iso(d)+'T'+hora(s);}
function addDiasISO(s,n){
  if(!s)return '';
  const [y,m,d]=s.split('-').map(Number);
  return iso(new Date(y,m-1,d+n));
}
function dinheiro(v){return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function diaDe(p){return p.inicio.split('T')[0];}
function local(id){return db.locais.find(l=>l.id===id);}
function nomeLocal(id){const l=local(id);return l?l.nome:'Sem local';}
function corDe(p){return p.cor||COR_PADRAO;}
function doMes(p){return diaDe(p).slice(0,7)===iso(mes).slice(0,7);}

/* ============ NAVEGAÇÃO ============ */
function ir(a){aba=a;render();window.scrollTo(0,0);}
function mudaMes(n){mes=new Date(mes.getFullYear(),mes.getMonth()+n,1);render();}
function selDia(d){diaSel=d;render();}
function setFiltro(f){filtroPag=f;render();}
function togglePago(id){
  const p=db.plantoes.find(x=>x.id===id);if(!p)return;
  p.pago=!p.pago;
  if(p.pago&&!p.dataPagamento)p.dataPagamento=iso(new Date());
  gravarSeguro([{c:'plantoes',obj:p}]);
  render();
}

  if(!pronto){main.innerHTML='<p class="vazio">Carregando…</p>';nav.innerHTML='';fab.style.display='none';return;}

function vCalendario(){
  const ano=mes.getFullYear(),m=mes.getMonth();
  const vazios=new Date(ano,m,1).getDay();
  const dias=new Date(ano,m+1,0).getDate();
  const hoje=iso(new Date());
  const doMesL=db.plantoes.filter(doMes);
  const somaM=l=>l.reduce((s,p)=>s+Number(p.valor||0),0);
  let h=`<div class="stats">
    <div><small>Plantões</small><b>${doMesL.length}</b></div>
    <div><small>A receber</small><b style="color:var(--no)">${dinheiro(somaM(doMesL.filter(p=>!p.pago)))}</b></div>
    <div><small>Recebido</small><b style="color:var(--ok)">${dinheiro(somaM(doMesL.filter(p=>p.pago)))}</b></div>
  </div>`;
  h+='<div class="painel">'+mesNav();
  h+=`<div style="display:flex;gap:8px;align-items:center"><button class="chip${modoVarios?' on':''}" onclick="toggleModoVarios()">${ic('multi')}${modoVarios?'Selecionando vários dias':'Selecionar vários dias'}</button>${modoVarios&&diasMulti.size?'<button class="chip" onclick="limparDias()">Limpar</button>':''}</div>`;
  h+='<div class="semana"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div><div class="grid">';
  for(let i=0;i<vazios;i++)h+='<div></div>';
  for(let d=1;d<=dias;d++){
    const k=`${ano}-${p2(m+1)}-${p2(d)}`;
    const pts=db.plantoes.filter(p=>diaDe(p)===k).slice(0,3).map(p=>`<i style="background:${corDe(p)}"></i>`).join('');
    const marcado=modoVarios?diasMulti.has(k):k===diaSel;
    h+=`<button class="dia${k===hoje?' hoje':''}${marcado?' sel':''}" onclick="clicouDia('${k}')">${d}<span class="dots">${pts}</span></button>`;
  }
  h+='</div></div>';
  h+=`<div class="acoes-cal">
    <button class="btn primary" onclick="editarModelo()">${ic('mais')}Cadastrar novo plantão</button>
    <button class="btn soft" onclick="novoPlantao()">${ic('mais')}Este dia</button>
    <button class="btn soft" onclick="abrirVarios()">${ic('multi')}Vários dias</button>
  </div>`;
  const lista=db.plantoes.filter(p=>diaDe(p)===diaSel).sort((a,b)=>a.inicio.localeCompare(b.inicio));
  const [y,mm,dd]=diaSel.split('-').map(Number);
  const nomeDia=new Date(y,mm-1,dd).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  h+=`<h3 class="sub">${nomeDia.charAt(0).toUpperCase()+nomeDia.slice(1)}</h3>`;
  h+=lista.length?lista.map(p=>cardPlantao(p,false)).join(''):'<p class="vazio">Nenhum plantão neste dia.</p>';
  return h;
}

function vPagamentos(){
  const ano=mes.getFullYear(),m=mes.getMonth();
  const lista=db.plantoes.filter(doMes).sort((a,b)=>a.inicio.localeCompare(b.inicio));
  const pagos=lista.filter(p=>p.pago), naoPagos=lista.filter(p=>!p.pago);
  const soma=l=>l.reduce((s,p)=>s+Number(p.valor||0),0);
  const visiveis=filtroPag==='pagos'?pagos:filtroPag==='nao'?naoPagos:lista;
  let h=`<div class="painel" style="padding:10px 12px">${mesNav().replace('class="mesnav"','class="mesnav" style="margin:0"')}</div>`;
  h+=`<div class="totais">
    <div><small>Recebido</small><b style="color:var(--ok)">${dinheiro(soma(pagos))}</b></div>
    <div><small>A receber</small><b style="color:var(--no)">${dinheiro(soma(naoPagos))}</b></div>
  </div>`;
  h+=`<div class="filtros">${[['todos','Todos'],['nao','Não pagos'],['pagos','Pagos']]
    .map(([k,t])=>`<button class="${filtroPag===k?'on':''}" onclick="setFiltro('${k}')">${t}</button>`).join('')}</div>`;
  h+=visiveis.length?visiveis.map(p=>cardPlantao(p,true)).join(''):'<p class="vazio">Nada por aqui neste mês.</p>';
  return h;
}

function vLocais(){

  const semLocal=modelos.filter(m=>!m.localId);
  if(semLocal.length){
    h+=`<div class="card" style="cursor:default"><div class="nome" style="margin:0">Sem local</div>${semLocal.map(itemModelo).join('')}</div>`;

const ICO_CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
function escolherCor(c){
  c=String(c).toLowerCase();
  document.getElementById('f_cor').value=c;
  let achou=false;
  document.querySelectorAll('#f_cores .cor').forEach(b=>{
    const on=b.dataset.cor===c;achou=achou||on;
    b.classList.toggle('on',on);b.setAttribute('aria-checked',on);
  });
  const outra=document.getElementById('f_cor_outra');
  if(outra){outra.classList.toggle('on',!achou);outra.style.background=achou?'':c;outra.classList.toggle('clara',!achou&&corClara(c));}
  const n=document.getElementById('f_cor_nome');
  if(n)n.innerHTML=`<i style="background:${c}"></i>${nomeCor(c)}`;

function swatches(atual){
  atual=String(atual||COR_PADRAO).toLowerCase();

function salvarPlantao(id){
  const g=x=>document.getElementById(x);
  const ini=g('f_ini').value, fim=g('f_fim').value;
  if(!ini||!fim){alert('Preencha início e fim.');return;}
  if(parseDT(fim)<=parseDT(ini)){alert('O fim precisa ser depois do início.');return;}
  const dados={
    nome:g('f_nome').value.trim(),
    localId:g('f_local').value||null,
    cor:g('f_cor').value,
    valor:parseFloat(String(g('f_valor').value).replace(',','.'))||0,
    inicio:ini,fim:fim,
    pago:g('f_pago').checked,
    dataPagamento:g('f_dpag').value,
    obs:g('f_obs').value.trim()
  };
  let itens=[];
  if(id){
    const p=db.plantoes.find(x=>x.id===id);
    Object.assign(p,dados);
    itens=[{c:'plantoes',obj:p}];
  }else{
    if(g('f_salvarmod').checked&&!dados.nome){alert('Dê um nome ao plantão para salvá-lo como cadastrado.');return;}
    const n=Math.max(0,parseInt(g('f_rep').value)||0);
    for(let k=0;k<=n;k++){
      const obj={id:uid(),...dados,
        inicio:addDias(ini,7*k),
        fim:addDias(fim,7*k),
        dataPagamento:addDiasISO(dados.dataPagamento,7*k)};
      db.plantoes.push(obj);
      itens.push({c:'plantoes',obj});
    }
    if(g('f_salvarmod').checked){
      const mod={id:uid(),nome:dados.nome,localId:dados.localId,cor:dados.cor,valor:dados.valor,
        hini:ini.split('T')[1].slice(0,5),hfim:fim.split('T')[1].slice(0,5)};
      db.modelos=db.modelos||[];db.modelos.push(mod);
      itens.push({c:'modelos',obj:mod});
    }
  }
  gravarSeguro(itens);
  fechar();render();
  if(!id)mostrarAviso(itens.some(i=>i.c==='modelos')?'Plantão criado e cadastrado com sucesso.':'Plantão criado com sucesso.');
}

function exportar(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='backup-marca-plantao-'+iso(new Date())+'.json';

function importar(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    let d;
    try{d=JSON.parse(r.result);}catch(e){d=null;}
    if(!d||!Array.isArray(d.plantoes)||!Array.isArray(d.locais)){alert('Arquivo inválido.');return;}
    if(!confirm('Substituir TODOS os seus dados atuais pelo backup?'))return;
    try{
      await apagarColecao('plantoes');
      await apagarColecao('locais');
      await apagarColecao('modelos');
      await gravar([
        ...d.locais.map(obj=>({c:'locais',obj})),
        ...d.plantoes.map(obj=>({c:'plantoes',obj})),
        ...(d.modelos||[]).map(obj=>({c:'modelos',obj}))
      ]);
      await carregarDados();
      render();
      alert('Backup restaurado.');
    }catch(e){alert('Erro ao restaurar: '+e.message);}
  };
  r.readAsText(f);
}
async function apagarTudo(){
  if(!confirm('Apagar TODOS os seus plantões e locais? Isso não pode ser desfeito.'))return;
  try{
    await apagarColecao('plantoes');
    await apagarColecao('locais');
    await apagarColecao('modelos');
    db={locais:[],plantoes:[],modelos:[]};
    render();
  }catch(e){alert('Erro ao apagar: '+e.message);}
}

/* ============ SWIPE NOS PLANTÕES ============ */
const ABRE=170;
let sw=null, swipeMoveu=false;
const conteudoEl=document.getElementById('conteudo');
conteudoEl.addEventListener('pointerdown',e=>{
  const card=e.target.closest('.swipe-card');
  if(!card)return;
  sw={card,x:e.clientX,y:e.clientY,dx:0,base:card.dataset.open==='1'?-ABRE:0,moved:false};
});
conteudoEl.addEventListener('pointermove',e=>{
  if(!sw)return;
  const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
  if(!sw.moved){
    if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>8){sw=null;return;}
    if(Math.abs(dx)<8)return;
    sw.moved=true;
    sw.card.style.transition='none';
  }
  sw.dx=dx;
  const pos=Math.max(-ABRE,Math.min(0,sw.base+dx));
  sw.card.style.transform=`translateX(${pos}px)`;
  sw.card.parentElement.classList.add('ativo');
});
function fimSwipe(){
  if(!sw)return;
  const {card,base,dx,moved}=sw;
  sw=null;
  if(!moved)return;
  swipeMoveu=true;
  setTimeout(()=>swipeMoveu=false,300);
  const abrir=(base+dx)<-ABRE/2;
  card.style.transition='transform .2s';
  card.dataset.open=abrir?'1':'0';
  card.style.transform=abrir?`translateX(-${ABRE}px)`:'translateX(0)';
  if(!abrir)setTimeout(()=>{if(card.dataset.open!=='1')card.parentElement.classList.remove('ativo');},220);
}
conteudoEl.addEventListener('pointerup',fimSwipe);
conteudoEl.addEventListener('pointercancel',fimSwipe);
function fecharSwipe(card){
  card.style.transition='transform .2s';
  card.dataset.open='0';
  card.style.transform='translateX(0)';
  setTimeout(()=>{if(card.dataset.open!=='1')card.parentElement.classList.remove('ativo');},220);
}
function cardClick(id){
  if(swipeMoveu)return;
  const c=document.querySelector(`.swipe-card[data-id="${id}"]`);
  if(c&&c.dataset.open==='1'){fecharSwipe(c);return;}
  editarPlantao(id);
}

/* ============ RESUMO PARA NOTA FISCAL ============ */
const CATS={diurno:'Plantões diurnos semana',noturno:'Plantões noturnos semana',diurno_fds:'Plantões diurnos FDS',noturno_fds:'Plantões noturnos FDS'};
const ORDEM_CAT=['diurno','noturno','diurno_fds','noturno_fds'];
// Compara nomes sem acento, maiúsculas ou espaços extras: "Emergência  Pediatrica" = "emergencia pediátrica"
function chaveNome(n){return (n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}

// Usa o dia e o horário do plantão lançado (não o do cadastro base).
// Noturno: a maior parte das horas fica entre 19:00 e 07:00. FDS: começa no sábado ou domingo.
function classificarPlantao(p){
  const ini=parseDT(p.inicio), fim=parseDT(p.fim||p.inicio);
  let noite=0, diaH=0;
  for(let t=new Date(ini);t<fim;t=new Date(t.getTime()+15*60000)){
    const h=t.getHours();
    if(h>=19||h<7)noite++;else diaH++;
  }
  const turno=(noite>diaH||(noite===diaH&&(ini.getHours()>=19||ini.getHours()<7)))?'noturno':'diurno';
  const dia=ini.getDay();
  return (dia===0||dia===6)?turno+'_fds':turno;
}
// Datas em ordem; com mais de um mês, junta os dias por mês: "28, 30/09 e 02, 05/10"
function textoDatas(itens){
  const ds=[...itens].sort((a,b)=>a.inicio.localeCompare(b.inicio)).map(p=>dataBR(p.inicio).slice(0,5));
  const porMes=[];
  ds.forEach(d=>{
    const [dia,m]=d.split('/');
    const ult=porMes[porMes.length-1];
    if(ult&&ult.m===m)ult.dias.push(dia);else porMes.push({m,dias:[dia]});
  });
  return porMes.map(g=>g.dias.join(', ')+'/'+g.m).join(' e ');
}
function filtrarResumo(localId,periodo,status,de,ate){
  return db.plantoes.filter(p=>
    (localId==='todos'||p.localId===localId) &&
    (periodo==='todos'||
      (periodo==='mes'&&diaDe(p).slice(0,7)===iso(mes).slice(0,7))||
      (periodo==='intervalo'&&(!de||diaDe(p)>=de)&&(!ate||diaDe(p)<=ate))) &&
    (status==='todos'||(status==='pagos'?p.pago:!p.pago))
  ).sort((a,b)=>a.inicio.localeCompare(b.inicio));
}
function gerarTextoNota(lista,de,ate){
  if(!lista.length)return 'Nenhum plantão encontrado com esses filtros.';
  const grupos={};
  lista.forEach(p=>{
    const cat=classificarPlantao(p);
    const unit=Number(p.valor||0);
    const nome=(p.nome||'').trim();
    const chave=cat+'|'+chaveNome(nome)+'|'+unit;
    if(!grupos[chave])grupos[chave]={cat,nome,unit,itens:[]};
    grupos[chave].itens.push(p);
  });
  const linhas=Object.values(grupos).sort((a,b)=>ORDEM_CAT.indexOf(a.cat)-ORDEM_CAT.indexOf(b.cat)||chaveNome(a.nome).localeCompare(chaveNome(b.nome))||a.unit-b.unit);
  const partes=linhas.map(g=>{
    const v=g.itens.reduce((s,p)=>s+Number(p.valor||0),0);
    return `${CATS[g.cat]}${g.nome?', '+g.nome:''}, dias ${textoDatas(g.itens)}, valor unitário ${dinheiro(g.unit)}, valor total ${dinheiro(v)}.`;
  });
  const total=lista.reduce((s,p)=>s+Number(p.valor||0),0);
  const ini=de?dataBR(de+'T00:00'):dataBR(lista[0].inicio), fim=ate?dataBR(ate+'T00:00'):dataBR(lista[lista.length-1].inicio);
  return `Período: ${ini} a ${fim}\n\n${partes.join('\n')}\n\nValor total: ${dinheiro(total)}`;
}
function abrirResumo(localId){
  const opts=['<option value="todos">Todos os locais</option>',
    ...db.locais.map(l=>`<option value="${l.id}" ${l.id===localId?'selected':''}>${esc(l.nome)}</option>`)].join('');
  abrirForm(`
    <h2>Resumo para nota fiscal</h2>
    <label>Local</label><select id="r_local" onchange="atualizaResumo()">${opts}</select>
    <label>Período</label>
    <select id="r_periodo" onchange="atualizaResumo()">
      <option value="intervalo">Escolher datas (de / até)</option>
      <option value="mes">Só o mês exibido no calendário</option>
      <option value="todos">Todo o período</option>
    </select>
    <div id="r_datas" style="display:flex;gap:8px">
      <div style="flex:1"><label>De</label><input id="r_de" type="date" value="${iso(new Date(mes.getFullYear(),mes.getMonth(),1))}" onchange="atualizaResumo()"></div>
      <div style="flex:1"><label>Até</label><input id="r_ate" type="date" value="${iso(new Date(mes.getFullYear(),mes.getMonth()+1,0))}" onchange="atualizaResumo()"></div>
    </div>
    <label>Situação</label>
    <select id="r_status" onchange="atualizaResumo()">
      <option value="todos">Todos</option>
      <option value="pagos">Só pagos</option>
      <option value="nao">Só não pagos</option>
    </select>
    <div id="r_resumo"></div>
    <label>Texto para colar na nota</label>
    <textarea id="r_texto" rows="10" readonly></textarea>
    <div class="acoes">
      <button class="btn" onclick="fechar()">Fechar</button>
      <button class="btn primary" onclick="copiarNota()">Copiar texto</button>
    </div>`);
  atualizaResumo();
}
function atualizaResumo(){
  const loc=document.getElementById('r_local').value;
  const per=document.getElementById('r_periodo').value;
  document.getElementById('r_datas').style.display=per==='intervalo'?'flex':'none';
  let de='',ate='';
  if(per==='intervalo'){
    de=document.getElementById('r_de').value;ate=document.getElementById('r_ate').value;
    if(de&&ate&&de>ate){[de,ate]=[ate,de];}
  }
  const lista=filtrarResumo(loc,per,document.getElementById('r_status').value,de,ate);
  const total=lista.reduce((s,p)=>s+Number(p.valor||0),0);
  document.getElementById('r_resumo').innerHTML=
    `<div class="totais" style="margin-top:12px"><div><small>Plantões</small><b>${lista.length}</b></div><div><small>Valor total</small><b>${dinheiro(total)}</b></div></div>`;
  document.getElementById('r_texto').value=gerarTextoNota(lista,de,ate);
}
function copiarNota(){
  const t=document.getElementById('r_texto');
  t.removeAttribute('readonly');
  t.select();
  t.setSelectionRange(0,999999);
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  t.setAttribute('readonly','');
  alert(ok?'Texto copiado. Agora é só colar na nota.':'Não consegui copiar automaticamente. Toque no texto, selecione tudo e copie.');
}

/* ============ MODELOS DE PLANTÃO ============ */
function opcoesModelos(){
  const ms=db.modelos||[];
  const op=m=>`<option value="${m.id}">${esc(m.nome)} · ${m.hini}–${m.hfim} · ${dinheiro(m.valor)}</option>`;
  const grupos=[...db.locais.map(l=>({id:l.id,nome:l.nome})),{id:null,nome:'Sem local'}];
  return grupos.map(g=>{
    const doLocal=ms.filter(m=>(m.localId||null)===g.id);
    return doLocal.length?`<optgroup label="${esc(g.nome)}">${doLocal.map(op).join('')}</optgroup>`:'';
  }).join('');
}
function aplicarModelo(){
  const m=(db.modelos||[]).find(x=>x.id===document.getElementById('f_modelo').value);
  if(!m){document.getElementById('f_nome').value='';document.getElementById('f_valor').value='';return;}
  const dia=document.getElementById('f_ini').value.split('T')[0]||diaSel;
  const ini=dia+'T'+m.hini;
  let fim=dia+'T'+m.hfim;
  if(parseDT(fim)<=parseDT(ini))fim=addDias(fim,1);
  document.getElementById('f_nome').value=m.nome;
  document.getElementById('f_local').value=m.localId||'';
  escolherCor(m.cor);
  document.getElementById('f_valor').value=m.valor||'';
  document.getElementById('f_ini').value=ini;
  document.getElementById('f_fim').value=fim;
}
function aplicarModeloVarios(){
  const m=(db.modelos||[]).find(x=>x.id===document.getElementById('v_modelo').value);
  if(!m){document.getElementById('v_nome').value='';document.getElementById('v_valor').value='';return;}
  document.getElementById('v_nome').value=m.nome;
  escolherCor(m.cor);
  document.getElementById('v_valor').value=m.valor||'';
  document.getElementById('v_ini').value=m.hini;
  document.getElementById('v_fim').value=m.hfim;
}
function usarModeloNoDia(id){
  const m=(db.modelos||[]).find(x=>x.id===id);
  if(!m)return;
  const base={id:'',nome:m.nome,localId:m.localId||null,cor:m.cor,valor:m.valor||'',
    inicio:diaSel+'T'+m.hini,fim:diaSel+'T'+m.hfim,pago:false,dataPagamento:'',obs:''};
  if(parseDT(base.fim)<=parseDT(base.inicio))base.fim=addDias(base.fim,1);
  aba='cal';
  formPlantao(base,true);
}
function editarModelo(id,localPreset){
  const lp=localPreset?local(localPreset):null;
  const m=id?(db.modelos||[]).find(x=>x.id===id):{id:'',nome:'',localId:localPreset||'',cor:lp?lp.cor:COR_PADRAO,valor:'',hini:'07:00',hfim:'19:00'};
  abrirForm(`
    <h2>${id?'Editar plantão cadastrado':'Cadastrar novo plantão'}</h2>
    <p class="muted" style="margin:0 0 6px">Fica salvo para você usar sempre que quiser. Ex.: Hospital Tricentenário → Emergência pediátrica.</p>
    <label>Local</label><select id="m_local" onchange="localEscolhido(this);mostraExistentes(this.value)">${opcoesLocal(m.localId)}</select>
    <div id="m_existentes" class="muted" style="margin-top:6px"></div>
    <label>Nome do plantão</label><input id="m_nome" value="${esc(m.nome)}" placeholder="Ex.: Emergência pediátrica">
    <label>Cor</label><div class="cores" id="f_cores">${swatches(m.cor)}</div><input type="hidden" id="f_cor" value="${m.cor}">
    <label>Valor (R$)</label><input id="m_valor" inputmode="decimal" value="${m.valor||''}">
    <label>Horário de início</label><input id="m_ini" type="time" value="${m.hini}">
    <label>Horário de fim</label><input id="m_fim" type="time" value="${m.hfim}">
    <div class="acoes">
      ${id?`<button class="btn danger" onclick="excluirModelo('${id}')">Excluir</button>`:''}
      <div class="direita">
        <button class="btn" onclick="fechar()">Cancelar</button>
        <button class="btn primary" onclick="salvarModelo('${id||''}')">Salvar</button>
      </div>
    </div>`);
  mostraExistentes(m.localId);
}
function mostraExistentes(lid){
  const el=document.getElementById('m_existentes');if(!el)return;
  const ms=(db.modelos||[]).filter(m=>(m.localId||null)===(lid||null));
  const l=local(lid);
  el.innerHTML=ms.length?`Já cadastrados${l?' em '+esc(l.nome):''}: ${ms.map(m=>esc(m.nome)).join(', ')}.<br>Para lançar um deles num dia, use <b>+ Este dia</b> ou <b>+ Vários dias</b>.`:'';
}
function salvarModelo(id){
  const g=x=>document.getElementById(x).value;
  const nome=g('m_nome').trim();
  if(!nome){alert('Dê um nome ao plantão.');return;}
  const dados={
    nome,
    localId:g('m_local')||null,
    cor:g('f_cor'),
    valor:parseFloat(String(g('m_valor')).replace(',','.'))||0,
    hini:g('m_ini')||'07:00',
    hfim:g('m_fim')||'19:00'
  };
  let obj;
  if(id){obj=db.modelos.find(x=>x.id===id);Object.assign(obj,dados);}
  else{obj={id:uid(),...dados};db.modelos=db.modelos||[];db.modelos.push(obj);}
  gravarSeguro([{c:'modelos',obj}]);
  fechar();render();
  mostrarAviso(id?'Plantão cadastrado atualizado.':'Plantão cadastrado com sucesso.');
}
let modoVarios=false;
let diasMulti=new Set();
function alvosDias(){
  return modoVarios&&diasMulti.size?[...diasMulti].sort():[diaSel];
}
function clicouDia(k){
  if(modoVarios){
    if(diasMulti.has(k))diasMulti.delete(k);else diasMulti.add(k);
    diaSel=k;
    render();
  }else selDia(k);
}
function toggleModoVarios(){
  modoVarios=!modoVarios;
  diasMulti=new Set(modoVarios?[diaSel]:[]);
  render();
}
function limparDias(){
  diasMulti=new Set();
  render();
}
function mostrarAviso(texto){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=texto;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h=setTimeout(()=>t.classList.remove('on'),2200);
}
function excluirModelo(id){
  if(!confirm('Excluir este modelo? Os plantões já criados não são apagados.'))return;
  db.modelos=(db.modelos||[]).filter(m=>m.id!==id);
  fs.collection('users').doc(usuario.uid).collection('modelos').doc(id).delete()
    .catch(e=>alert('Não consegui excluir na nuvem: '+e.message));
  fechar();render();
}

render();
</script>
</body>
</html>
